<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Portfolio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="portfolio.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            PortfoliAI
        </a>

        <button
            class="btn btn-outline-light"
            onclick="logout()">
            Logout
        </button>
    </nav>


    <!-- Hero -->
    <section class="hero text-center">

        <div class="container">

            <h1 id="headline">
                Loading...
            </h1>

            <p id="summary">
                Please wait while your AI portfolio loads.
            </p>

            <div class="mt-4">

                <a
                    id="linkedin"
                    href="#"
                    target="_blank"
                    class="btn btn-primary me-2">
                    LinkedIn
                </a>

                <a
                    id="github"
                    href="#"
                    target="_blank"
                    class="btn btn-dark">
                    GitHub
                </a>

            </div>

        </div>

    </section>


    <!-- About -->
    <section class="section">

        <div class="container">

            <h2>About Me</h2>

            <p id="about">
                Loading...
            </p>

        </div>

    </section>


    <!-- Skills -->
    <section class="section">

        <div class="container">

            <h2>Skills</h2>

            <div
                id="skills"
                class="skills-container">
            </div>

        </div>

    </section>


    <!-- Projects -->
    <section class="section">

        <div class="container">

            <h2>Projects</h2>

            <div
                id="projects"
                class="row g-4">
            </div>

        </div>

    </section>


    <!-- Experience -->
    <section class="section">

        <div class="container">

            <h2>Experience</h2>

            <div id="experience">
            </div>

        </div>

    </section>


    <!-- Education -->
    <section class="section">

        <div class="container">

            <h2>Education</h2>

            <div id="education">
            </div>

        </div>

    </section>


    <!-- Certificates -->
    <section class="section">

        <div class="container">

            <h2>Certificates</h2>

            <div
                id="certificates"
                class="row g-4">
            </div>

        </div>

    </section>


    <!-- Achievements -->
    <section class="section">

        <div class="container">

            <h2>Achievements</h2>

            <div id="achievements">
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="text-center py-4">

        <p>
            Generated with ease by PortfoliAI
        </p>

    </footer>


    <script src="portfolio.js"></script>

</body>

</html>
