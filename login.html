<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center px-3">

        <div class="row justify-content-center w-100">

            <!-- Responsive width -->
            <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">

                <form class="login-box p-4 p-md-5 rounded-4">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2">Welcome Back</h2>
                        <p class="text-secondary mb-0">
                            Please sign in to continue
                        </p>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">
                            Username
                        </label>

                        <input type="text" class="form-control form-control-lg"id="username"placeholder="Enter your username"required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password" required   >
                    </div>

                    <button type="submit" class="btn login-btn btn-lg w-100"
                    onclick="location.href='Dashboard.html'">
                        Login
                    </button>

                    <div class="text-center mt-4">
                        <a href="signup.html" class="signup-link">
                            Don't have an account?
                            <strong>Sign Up</strong>
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
